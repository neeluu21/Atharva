global
    log /dev/log local0
    maxconn 2000
    daemon

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend http_front
    bind *:80
    default_backend app_servers

backend app_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server app1 127.0.0.1:3000 check inter 2000 rise 2 fall 3
    server app2 127.0.0.1:3001 check inter 2000 rise 2 fall 3
    server app3 127.0.0.1:3002 check inter 2000 rise 2 fall 3
